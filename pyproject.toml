[project]
name = "lexis"
version = "1.0.0"
description = "Extração auditável de avisos de eventos corporativos (Asset Servicing)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "pydantic>=2.7",
    "pdfplumber>=0.11",
    "pillow>=10",
]

[project.scripts]
lexis = "lexis.h_interfaces.cli:main"

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10"]
aws = ["boto3>=1.34"]
web = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]
# SQLAlchemy Core: SQL portátil (MySQL no compose, SQLite nos testes, SQL Server trocando o driver)
db = ["sqlalchemy>=2.0,<2.1", "pymysql>=1.1"]
dev = ["pytest>=8", "pytest-cov", "ruff", "mypy", "pip-audit", "reportlab", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["a_src/b_backend"]

[tool.setuptools.package-data]
lexis = ["a_domain/rules.json"]

[tool.pytest.ini_options]
testpaths = ["b_tests"]
pythonpath = ["a_src/b_backend", "."]

[tool.ruff]
line-length = 120
src = ["a_src/b_backend", "b_tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"b_tests/*" = ["S", "E501", "B017"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["a_src/b_backend"]

[[tool.mypy.overrides]]
module = ["pytesseract", "pytesseract.*", "boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true
